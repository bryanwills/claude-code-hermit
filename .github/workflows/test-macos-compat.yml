name: macOS Compat

# Answers "does hermit run on macOS" on free public-repo runners. Deliberately
# NOT matrixed into the per-plugin suites: the parallelism flags are already
# fragile across core counts (see test-hooks.yml's comment block, which reverted
# a --parallel=4 pin after CI contention), and macOS runners are a third one.
# Running serial sidesteps that question instead of re-tuning it on a platform
# with no confirmed operators.
on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC: a macOS-only regression in TS-only code surfaces
    # here within days rather than at a release.
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      # The platform-specific surfaces: shell that meets BSD userland, scripts
      # that branch on process.platform, and every plugin's tests/. The last one
      # is load-bearing: the first run of this job failed on test fixtures, not on
      # product code (unresolved os.tmpdir() compared against resolved
      # process.cwd()), so a test-only push has to be able to retrigger it.
      - 'plugins/claude-code-hermit/scripts/**'
      - 'plugins/*/state-templates/bin/**'
      - 'plugins/*/tests/**'
      - '.github/workflows/test-macos-compat.yml'
  pull_request:
    paths:
      - 'plugins/claude-code-hermit/scripts/**'
      - 'plugins/*/state-templates/bin/**'
      - 'plugins/*/tests/**'
      - '.github/workflows/test-macos-compat.yml'

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # HA's gate-corpus.test.ts materializes the retired Python gates from
          # git history, so it needs the full history (matches test-ha.yml).
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      # Python is a TEST FIXTURE for the HA suite only; nothing shipped runs it.
      # gate-corpus replays the retired Python hooks and yaml-parity compares
      # against PyYAML. Same versions test-ha.yml pins.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml python-dotenv
      - run: bun install --frozen-lockfile
      # 20+ core test files spawn real tmux sessions; it is not preinstalled on
      # macOS runners. Printing the version also proves the suite below is
      # exercising tmux rather than silently skipping.
      - name: Ensure tmux
        run: tmux -V || (brew install tmux && tmux -V)
      # Serial: no --parallel. --timeout stays at 45s as headroom for the in-test
      # Date.now() poll deadlines (harness-command-delivery, proc-survivor,
      # hermit-stop) that --timeout does not itself extend.
      - name: Core suite
        if: '!cancelled()'
        run: bun test --timeout=45000
        working-directory: plugins/claude-code-hermit
      - name: Home Assistant suite
        if: '!cancelled()'
        run: bun test --timeout=45000
        working-directory: plugins/claude-code-homeassistant-hermit
      - name: Feed suite
        if: '!cancelled()'
        run: bun test --timeout=45000
        working-directory: plugins/feed-hermit
      - name: Dev suite
        if: '!cancelled()'
        run: bash tests/run-all.sh
        working-directory: plugins/claude-code-dev-hermit
      - name: Fitness suite
        if: '!cancelled()'
        run: bash tests/run-all.sh
        working-directory: plugins/claude-code-fitness-hermit
      - name: Scribe suite
        if: '!cancelled()'
        run: bash tests/run-all.sh
        working-directory: plugins/hermit-scribe
      # laravel-forge-hermit is excluded: tests/run-all.sh shells out to composer
      # and php, neither reliably present on a macOS runner. Adding a PHP
      # toolchain here is a separate decision.
